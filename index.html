            border: 5px solid #f3f3f3;

            height: 100%;

            z-index: 5;
            overflow: hidden;

            position: absolute;
            font-size: 20px;
            color: rgba(0, 123, 255, 0.4);
            animation: float 6s ease-in-out infinite;
        }

            0% { transform: translateY(0) rotate(0deg); opacity: 0; }

<body>
    <!-- 裝飾元素 -->
    <div class="decoration" id="decoration"></div>
    
    <!-- 密碼表單 -->
    <div class="password-container" id="passwordForm">
        <div class="password-form">
            <h2>🥚韋宏A教育組新人開群步驟</h2>
            <p class="description">美安群組經營 SOP<br>歡迎來到團隊群組經營 SOP 知識庫！這裡包含了經營美安、群組管理的完整流程與指南，幫助您快速掌握團隊運作的核心技能。</p>
            <input type="password" id="password" placeholder="請輸入知識庫密碼" autocomplete="off">
            <button onclick="checkPassword()">進入知識庫</button>
            <p style="font-size: 12px; color: #888; margin-top: 15px;">新人快速啟動組合多少$？</p>
        </div>
    </div>
    
    <!-- 加載指示器 -->
    <div class="loader-container" id="loader">
        <div class="loader"></div>
    </div>
    
    <!-- Super.so網站iframe -->
    <iframe 
        id="supersoFrame"
        class="iframe-container" 
        allowfullscreen
        onload="frameLoaded()">
    </iframe>
    
    <script>
        // 創建漂浮的蛋裝飾
        function createEggs() {
            const decoration = document.getElementById('decoration');
            const eggSymbols = ['🥚', '🐣', '🐤', '🐥', '📝', '📊'];
            
            for (let i = 0; i < 20; i++) {
                const egg = document.createElement('div');
                egg.className = 'egg';
                egg.textContent = eggSymbols[Math.floor(Math.random() * eggSymbols.length)];
                egg.style.left = Math.random() * 100 + 'vw';
                egg.style.animationDuration = (Math.random() * 10 + 5) + 's';
                egg.style.animationDelay = (Math.random() * 5) + 's';
                egg.style.fontSize = (Math.random() * 20 + 10) + 'px';
                decoration.appendChild(egg);
            }
        }
        
        // 頁面載入時創建裝飾
        window.addEventListener('load', createEggs);
        
        // 檢查密碼
        function checkPassword() {
            // 設置您的密碼
            const correctPassword = "15970";
            const passwordInput = document.getElementById("password").value;
            
            if (passwordInput === correctPassword) {
                // 顯示加載指示器
                document.getElementById("loader").style.display = "flex";
                document.getElementById("passwordForm").style.opacity = "0";
                
                setTimeout(function() {
                    document.getElementById("passwordForm").style.display = "none";
                    
                    // 設置iframe源並顯示
                    document.getElementById("supersoFrame").src = "https://abundant-tortoise.super.site/";
                    document.getElementById("supersoFrame").style.display = "block";
                }, 500);
            } else {
                alert("密碼錯誤，請重試！");
                document.getElementById("password").value = "";
                document.getElementById("password").focus();
            }
        }
        
        // iframe加載完成後隱藏加載指示器
        function frameLoaded() {
            setTimeout(function() {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(function() {
                    document.getElementById('loader').style.display = 'none';
                }, 500);
            }, 1000);
        }
        
        // 按Enter鍵提交密碼
        document.getElementById("password").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>
